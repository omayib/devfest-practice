<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lyria Camera Workshop</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <section class="stage">
        <video id="camera" autoplay playsinline muted></video>
        <img id="snapshot" alt="Last frame sent to Gemini" hidden />
      </section>

      <section class="panel">
        <h1>Lyria Camera</h1>
        <p class="subtitle">Point your camera at something and listen.</p>

        <button id="toggle" type="button">▶ Start</button>
        <p id="status" role="status">Starting camera…</p>

        <h2>Current prompts</h2>
        <ul id="prompts"></ul>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
